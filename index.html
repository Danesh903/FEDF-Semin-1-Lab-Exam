<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header, footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #444;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .categories {
            text-align: center;
            padding: 15px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover {
            background: #055c40;
        }

        @media (max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 6px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>My E-Commerce Store</h1>
        <p>Quality products at affordable prices</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#categories">Categories</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="categories" class="categories">
        <h2>Product Categories</h2>
        <p>Electronics | Fashion | Accessories</p>
    </section>

    <main id="products" class="products">
        <article class="card">
            <img src="https://dummyimage.com/250x160/ddd/222&text=Phone"
                 alt="Smartphone">
            <h3>Smartphone</h3>
            <p>Price: ₹15,000</p>
            <button onclick="buy('Smartphone')">Buy Now</button>
        </article>

        <article class="card">
            <img src="https://dummyimage.com/250x160/ddd/222&text=Laptop"
                 alt="Laptop">
            <h3>Laptop</h3>
            <p>Price: ₹45,000</p>
            <button onclick="buy('Laptop')">Buy Now</button>
        </article>

        <article class="card">
            <img src="https://dummyimage.com/250x160/ddd/222&text=Watch"
                 alt="Watch">
            <h3>Smart Watch</h3>
            <p>Price: ₹2,000</p>
            <button onclick="buy('Smart Watch')">Buy Now</button>
        </article>
    </main>

    <footer id="contact">
        <p>Contact: support@example.com</p>
        <p>&copy; 2026 My E-Commerce Store</p>
    </footer>

    <script>
        function buy(product) {
            alert(product + " selected successfully!");
        }
    </script>
</body>
</html>
